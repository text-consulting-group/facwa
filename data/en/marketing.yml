############################ faqs ##########################
faq:
  title: Frequently Asked Questions
  enable: true
  content: Here are answers to frequently asked questions. Find the information you need.
  url: "https://facwa.kr"
  listItem:
    - question: What is the purpose of the Institute for Peace and Worlding Studies?
      answer: The Institute for Peace and Worlding Studies contributes to academic advancement through research, education, and other activities related to materials on wars and the Cold War in East Asia and Korea, peace, damages from Japanese colonial rule, and the issue of Japanese military "comfort women." (Institute Regulations Article 2, Section 3)
    - question: What is the vision of the Institute for Peace and Worlding Studies?
      answer: 1. Hub for Cold War Asia and peace research / 2. Building a Cold War peace digital archive / 3. Hub for (post-)Cold War peace education and exchange
    - question: What regulations should I follow when referencing related materials in articles/papers/videos?
      answer: The articles/papers/videos you are currently viewing are fully public materials. For translations, comments, and other copyright related to the footage, please credit "Institute for Peace and Worlding Studies, Sungkonghoe University" when using them.

