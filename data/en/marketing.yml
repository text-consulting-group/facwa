card:
  layout: 3-column
  bg: bg-gray-300
  category: Ideological-Psychological Warfare and Affect in Cold War Asia through Moving Images Symposium
  title: Project Introduction
  enable: true
  content: At NARA II (National Archives and Records Administration), there are numerous photographs and moving images produced by military and civilian photographers and cameramen on the themes of division, the Cold War, and war in Korea, North Korea, and Asia. In the photographic records, U.S. military still photographers appear alongside photographers from major photojournalism magazines, and their works survive in large numbers across U.S. Army Signal Corps and USIS record groups. These images capture not only military subjects and wartime scenes but also everyday life and Cold War societies across Korea and Asia, including Japan, Taiwan, and the Philippines. The film holdings likewise include many anti-communist developmental and psychological-warfare productions made by U.S. film companies and military cameramen. NARA II also preserves photographs and films shot in North Korea and the Soviet sphere between liberation and the outbreak of the Korean War, many of them seized by U.S. forces during the occupation of North Korea. Some materials include documentaries and feature films produced in North Korea after liberation. This symposium investigates the related documentary records as well, in order to examine the production and management of these visual sources through the lens of ideological-psychological warfare and affect under division and the Cold War.
  listItem:
    - category: Part 1
      title: Im Jae-geun
      description: "(Combined) Blind Spots and Affect in the Destruction of Bridges and Railways: Focusing on Korean War Footage from Daejeon"
      image: "https://img.youtube.com/vi/KfEK6p824o0/sddefault.jpg"
      date: 2021.03.27
      identifier: ccwps-01
      author: Im Jae-geun
      creator: ADC 8207, ADC 8105, ADC 812, 1ADC 8373, ADC 8401 - RG111
      url: "https://www.youtube.com/embed/KfEK6p824o0"
    - category: Part 1
      title: Little Switch Operation, Korea (OPERATION LITTLE SWITCH, LITTLE SWAP, TRAIN ENROUTE TO MUNSAN-NI, KOREA)
      description: This footage shows the train from Busan through Daegu to Munsan station on April 24, 1953, during the wounded prisoner of war repatriation and the prisoner reception center at Freedom Village. Wounded prisoner of war exchange began on April 20, 1953, with daily departures from Busan through Daegu to Yeongdeungpo and Munsan stations. The footage shows wounded prisoner of war resting on the train and viewing the surrounding scenery. They stopped briefly at Daegu station before proceeding through Yeongdeungpo to Munsan. The footage shows the process from Munsan station to Daeseongdong Freedom Village and captures the important reception headquarters and surrounding facilities for prisoner exchange. It also shows wounded prisoner of war arriving at Busan port from Geoje Island and Jeju Island at the end. This footage is unedited.
      image: "https://img.youtube.com/vi/SK0CF9j-uSc/sddefault.jpg"
      date: 1953.04.24
      identifier: ccwps-02
      author: Kim Il-hwan
      creator: RG 111-LC-32406, NARA
      url: "https://www.youtube.com/embed/SK0CF9j-uSc"
    - category: Part 1
      title: Little Switch, 5th ROK MASH, Munsan-ni, Korea
      description: This footage shows the process of wounded prisoner of war exchange at Panmunjom on April 24, 1953. Notably, this footage contains indoor interrogation and meal procedures of ROK soldiers repatriated to the South during the Little Switch operation.
      image: "https://img.youtube.com/vi/E_twoRhPk3M/sddefault.jpg"
      date: 1953.04.25
      identifier: ccwps-03
      author: Kim Il-hwan
      creator: RG 111-LC-32529, NARA
      url: "https://www.youtube.com/embed/E_twoRhPk3M"
    - category: Part 1
      title: Big Switch, Munsan-ni and Panmunjom, Korea
      description: This footage shows the Big Switch operation on August 6, 1953.
      image: "https://img.youtube.com/vi/t9SoEBrc-Io/sddefault.jpg"
      date: 2021.03.27
      identifier: ccwps-04
      author: Kim Il-hwan
      creator: RG 111-LC-33737, NARA
      url: "https://www.youtube.com/embed/t9SoEBrc-Io"
    - category: Part 1
      title: Pohang, Korea, Operation Recovery (OPERATION RECOVERY (RELEASE OF NORTH KOREAN SOLDIERS WHO WERE TAKEN PRISONERS OF WAR BY THE SOUTH KOREAN ARMY), POHANG DONG, KOREA)
      description: This footage shows non-repatriated prisoner of war released from Panmunjom enlisting at the Pohang recruit training center on January 21, 1954.
      image: "https://img.youtube.com/vi/MXPOgefJSqE/sddefault.jpg"
      date: 2021.01.21 - 2021.01.23
      identifier: ccwps-05
      author: Kim Il-hwan
      creator: RG 1111-LC-34807, NARA
      url: "https://www.youtube.com/embed/MXPOgefJSqE"
    - category: Part 2
